name: Build sing-box (v2ray_api)

# 构建带 with_v2ray_api 标签的 sing-box，用于流量面板的 AnyTLS 每用户统计。
# 官方 sing-box 默认二进制不含 v2ray_api，需要此定制构建。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
          - arch: 386
            goarch: 386
          - arch: armv5
            goarch: arm
            goarm: "5"
          - arch: armv6
            goarch: arm
            goarm: "6"
          - arch: armv7
            goarch: arm
            goarm: "7"
          - arch: ppc64le
            goarch: ppc64le
          - arch: riscv64
            goarch: riscv64
          - arch: s390x
            goarch: s390x
          - arch: loong64
            goarch: loong64
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box

      - name: Determine and checkout sing-box version
        run: |
          TAG=$(git ls-remote --tags origin 'refs/tags/v*' | sed 's|.*refs/tags/||; s|\^{}||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$TAG" ]; then TAG="v1.13.19"; fi
          echo "SINGBOX_TAG=${TAG}" >> "$GITHUB_ENV"
          git fetch --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout "${TAG}"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w" \
            -tags "with_v2ray_api,with_clash_api,with_utls,with_acme" \
            -o "sing-box-v2rayapi-linux-${{ matrix.arch }}" ./cmd/sing-box
          sha256sum "sing-box-v2rayapi-linux-${{ matrix.arch }}" > "sing-box-v2rayapi-linux-${{ matrix.arch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-v2rayapi-linux-${{ matrix.arch }}
          path: |
            sing-box-v2rayapi-linux-${{ matrix.arch }}
            sing-box-v2rayapi-linux-${{ matrix.arch }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
