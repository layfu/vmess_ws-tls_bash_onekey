name: Build panel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
          - arch: 386
            goarch: 386
          - arch: armv5
            goarch: arm
            goarm: "5"
          - arch: armv6
            goarch: arm
            goarm: "6"
          - arch: armv7
            goarch: arm
            goarm: "7"
          - arch: ppc64le
            goarch: ppc64le
          - arch: riscv64
            goarch: riscv64
          - arch: s390x
            goarch: s390x
          - arch: loong64
            goarch: loong64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        working-directory: panel
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w" -o "panel-linux-${{ matrix.arch }}" .
          sha256sum "panel-linux-${{ matrix.arch }}" > "panel-linux-${{ matrix.arch }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panel-linux-${{ matrix.arch }}
          path: |
            panel/panel-linux-${{ matrix.arch }}
            panel/panel-linux-${{ matrix.arch }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
