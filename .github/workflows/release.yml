name: Build panel & sing-box

# tag 触发入口：构建流量面板与带 v2ray_api 的 sing-box，合并到同一个 Release。
# 实际构建逻辑见 build-release.yml（可复用）。

on:
  push:
    tags:
      - 'v*'
      - 'singbox-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/build-release.yml
    with:
      release_name: ${{ github.ref_name }}
