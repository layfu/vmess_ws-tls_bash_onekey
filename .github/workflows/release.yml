name: Build panel & sing-box

# 构建流量面板与带 v2ray_api 的 sing-box，合并到同一个 Release（单一 release job 避免并发冲突）。

on:
  push:
    tags:
      - 'v*'
      - 'singbox-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
          - arch: 386
            goarch: 386
          - arch: armv5
            goarch: arm
            goarm: "5"
          - arch: armv6
            goarch: arm
            goarm: "6"
          - arch: armv7
            goarch: arm
            goarm: "7"
          - arch: ppc64le
            goarch: ppc64le
          - arch: riscv64
            goarch: riscv64
          - arch: s390x
            goarch: s390x
          - arch: loong64
            goarch: loong64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        working-directory: panel
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w" -o "panel-linux-${{ matrix.arch }}" .
          sha256sum "panel-linux-${{ matrix.arch }}" > "panel-linux-${{ matrix.arch }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panel-linux-${{ matrix.arch }}
          path: |
            panel/panel-linux-${{ matrix.arch }}
            panel/panel-linux-${{ matrix.arch }}.sha256

  singbox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
          - arch: 386
            goarch: 386
          - arch: armv5
            goarch: arm
            goarm: "5"
          - arch: armv6
            goarch: arm
            goarm: "6"
          - arch: armv7
            goarch: arm
            goarm: "7"
          - arch: ppc64le
            goarch: ppc64le
          - arch: riscv64
            goarch: riscv64
          - arch: s390x
            goarch: s390x
          - arch: loong64
            goarch: loong64
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box

      - name: Determine and checkout sing-box version
        run: |
          TAG=$(git ls-remote --tags origin 'refs/tags/v*' | sed 's|.*refs/tags/||; s|\^{}||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$TAG" ]; then TAG="v1.13.19"; fi
          echo "SINGBOX_TAG=${TAG}" >> "$GITHUB_ENV"
          git fetch --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout "${TAG}"

      - name: Patch AnyTLS inbound log (include source address)
        run: |
          sed -i 's/inbound connection to ", metadata.Destination)/inbound connection from ", metadata.Source, " to ", metadata.Destination)/g' protocol/anytls/inbound.go

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w" \
            -tags "with_v2ray_api,with_clash_api,with_utls,with_acme" \
            -o "sing-box-v2rayapi-linux-${{ matrix.arch }}" ./cmd/sing-box
          sha256sum "sing-box-v2rayapi-linux-${{ matrix.arch }}" > "sing-box-v2rayapi-linux-${{ matrix.arch }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-v2rayapi-linux-${{ matrix.arch }}
          path: |
            sing-box-v2rayapi-linux-${{ matrix.arch }}
            sing-box-v2rayapi-linux-${{ matrix.arch }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [panel, singbox]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Detect built sing-box version
        run: |
          TAG=$(git ls-remote --tags https://github.com/SagerNet/sing-box.git 'refs/tags/v*' \
            | sed 's|.*refs/tags/||; s|\^{}||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "SINGBOX_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "sing-box: ${SINGBOX_TAG}"
