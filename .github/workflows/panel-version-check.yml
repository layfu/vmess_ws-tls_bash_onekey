name: Panel version check

# 若本次提交改动了 panel/ 下的文件（不含 panel/VERSION 本身），
# 但未同步 bump panel/VERSION，则构建失败，提醒手动递增面板版本。
# 若在 push 到 master 时 bump 了 panel/VERSION，则自动构建并发布一次 Release。

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check panel/VERSION bump
        id: bump
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "首次提交，跳过比对"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD -- panel/ | grep -v '^panel/VERSION$' || true)
          VERSION_CHANGED=$(git diff --name-only "$BASE" HEAD -- panel/VERSION)

          if [ -n "$CHANGED" ] && [ -z "$VERSION_CHANGED" ]; then
            echo "错误：panel/ 下有改动但未 bump panel/VERSION："
            echo "$CHANGED"
            exit 1
          fi

          if [ -n "$VERSION_CHANGED" ]; then
            echo "panel/VERSION 已同步 bump，检查通过"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat panel/VERSION)" >> "$GITHUB_OUTPUT"
          else
            echo "panel/ 无改动（或仅 panel/VERSION），跳过检查"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: github.event_name == 'push' && needs.check.outputs.bumped == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      release_name: panel-v${{ needs.check.outputs.version }}
