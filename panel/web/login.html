<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 流量面板</title>
<style>
:root {
  --bg: #0f1216;
  --panel: #171c22;
  --border: #242b34;
  --text: #d7dee8;
  --muted: #8a96a3;
  --accent: #4f8cff;
  --err: #ff5a5a;
}
html { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}
.card {
  width: 320px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px 24px;
}
.card h1 { font-size: 18px; margin: 0 0 4px; }
.card .sub { color: var(--muted); font-size: 12px; margin: 0 0 20px; }
label { display: block; color: var(--muted); font-size: 12px; margin: 0 0 6px; }
input {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 13px;
  margin-bottom: 14px;
}
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
button {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 9px;
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
}
button:hover { background: #6ba1ff; }
button:active { background: #3d74d9; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.6; cursor: default; }
#msg { min-height: 18px; margin-top: 12px; font-size: 12px; color: var(--err); text-align: center; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="card">
  <h1>流量面板</h1>
  <p class="sub">请输入登录凭据</p>
  <form id="form" autocomplete="on">
    <label for="username">用户名</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">密码</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" id="submit">登录</button>
  </form>
  <div id="msg" role="alert" aria-live="polite"></div>
</div>
<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  submit.disabled = true;
  submit.textContent = '登录中…';
  try {
    const res = await fetch('api/login', {
      method: 'POST',
      body: new FormData(form),
      cache: 'no-store',
    });
    if (res.ok) {
      location.replace('./');
      return;
    }
    let text = '登录失败';
    try {
      const data = await res.json();
      if (data && data.error) text = data.error;
    } catch (_) {}
    msg.textContent = text;
  } catch (_) {
    msg.textContent = '网络错误，请重试';
  } finally {
    submit.disabled = false;
    submit.textContent = '登录';
  }
});
</script>
</body>
</html>
