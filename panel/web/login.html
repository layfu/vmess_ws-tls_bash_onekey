<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 流量面板</title>
<style>
:root {
  --bg: #0a0c0f;
  --surface: #11151b;
  --surface-2: #161c24;
  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.1);
  --highlight: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  --text: #e6ebf2;
  --text-secondary: #a6b0bd;
  --muted: #6b7686;
  --accent: #5b8cff;
  --err: #ff5a5a;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
html { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(600px 320px at 25% -10%, rgba(91, 140, 255, 0.08), transparent 60%),
    radial-gradient(520px 280px at 80% -10%, rgba(62, 207, 155, 0.05), transparent 60%);
}
.card {
  width: 336px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 30px 26px;
  box-shadow: var(--highlight), 0 16px 48px rgba(0, 0, 0, 0.5);
  animation: panel-in 320ms var(--ease-out) both;
}
@keyframes panel-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.logo { width: 34px; height: 34px; border-radius: 9px; flex: none; }
.logo svg { width: 100%; height: 100%; display: block; }
.brand-name { font-size: 17px; font-weight: 600; }
.card .sub { color: var(--muted); font-size: 12px; margin: 0 0 22px; }
label { display: block; color: var(--text-secondary); font-size: 12px; margin: 0 0 6px; }
input {
  width: 100%;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 13px;
  margin-bottom: 16px;
  transition: border-color 150ms var(--ease-out);
}
input:hover { border-color: var(--border-strong); }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
button {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: var(--highlight);
  transition: background-color 150ms ease, transform 160ms var(--ease-out);
}
button:hover { background: #7aa3ff; }
button:active { background: #4a76d9; transform: scale(0.97); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.6; cursor: default; }
#msg { min-height: 18px; margin-top: 14px; font-size: 12px; color: var(--err); text-align: center; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <defs>
          <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5b8cff"/>
            <stop offset="1" stop-color="#3ecf9b"/>
          </linearGradient>
        </defs>
        <rect width="24" height="24" rx="7" fill="url(#logo-g)"/>
        <path d="M7 15V9M12 15V5M17 15v-4" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
    <span class="brand-name">流量面板</span>
  </div>
  <p class="sub">请输入登录凭据</p>
  <form id="form" autocomplete="on">
    <label for="username">用户名</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">密码</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" id="submit">登录</button>
  </form>
  <div id="msg" role="alert" aria-live="polite"></div>
</div>
<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  submit.disabled = true;
  submit.textContent = '登录中…';
  try {
    const res = await fetch('api/login', {
      method: 'POST',
      body: new FormData(form),
      cache: 'no-store',
    });
    if (res.ok) {
      location.replace('./');
      return;
    }
    let text = '登录失败';
    try {
      const data = await res.json();
      if (data && data.error) text = data.error;
    } catch (_) {}
    msg.textContent = text;
  } catch (_) {
    msg.textContent = '网络错误，请重试';
  } finally {
    submit.disabled = false;
    submit.textContent = '登录';
  }
});
</script>
</body>
</html>
