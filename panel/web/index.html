<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流量面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>流量面板</h1>
  <div class="stats">
    <div class="stat"><span class="label">当月上行</span><span class="value" id="total-up">—</span></div>
    <div class="stat"><span class="label">当月下行</span><span class="value" id="total-down">—</span></div>
    <div class="stat"><span class="label">用户数</span><span class="value" id="total-users">—</span></div>
  </div>
</header>

<main>
  <section>
    <h2>当月流量 <span class="hint">上行/下行/总量为当月流量，累计为终身总量</span>
    </h2>
    <div class="table-wrap">
      <table id="users-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="protocol">协议<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="username">用户<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="uplink">上行<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="downlink">下行<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="total">总量<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="lifetime">累计<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="online">状态<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="last_seen">最近活跃<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>流量趋势</h2>
    <div class="filters">
      <div class="ms" id="chart-user"></div>
      <select id="chart-hours">
        <option value="24">最近 24 小时</option>
        <option value="72">最近 3 天</option>
        <option value="168">最近 7 天</option>
      </select>
      <button id="clear-chart-filters" class="btn ghost">清除</button>
    </div>
    <div id="chart"></div>
  </section>

  <section>
    <h2>最近连接</h2>
    <div class="filters">
      <div class="ms" id="conn-protocol"></div>
      <div class="ms" id="conn-user"></div>
      <div class="ms" id="conn-status"></div>
      <button id="clear-conn-filters" class="btn ghost">清除</button>
    </div>
    <div class="table-wrap conn-scroll">
      <table id="conn-table">
        <thead>
          <tr>
            <th>时间</th>
            <th>协议</th>
            <th>用户</th>
            <th>状态</th>
            <th>来源</th>
            <th>目标</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button id="conn-more" class="btn-more">加载更多</button>
  </section>

  <section>
    <h2>历史统计</h2>
    <div class="filters">
      <div class="ms" id="hist-protocol"></div>
      <div class="ms" id="hist-user"></div>
      <select id="hist-range">
        <option value="7">近 7 天</option>
        <option value="30">近 1 个月</option>
        <option value="90">近 3 个月</option>
        <option value="180">近半年</option>
        <option value="365">近 1 年</option>
        <option value="1095">近 3 年</option>
        <option value="custom">自定义</option>
      </select>
      <span id="hist-custom" style="display:none;">
        <input type="date" id="hist-from">
        <input type="date" id="hist-to">
      </span>
      <button id="clear-hist-filters" class="btn ghost">清除</button>
    </div>
    <div class="hist-summary">
      <div class="stat"><span class="label">上行</span><span class="value" id="hist-up">—</span></div>
      <div class="stat"><span class="label">下行</span><span class="value" id="hist-down">—</span></div>
      <div class="stat"><span class="label">总量</span><span class="value" id="hist-total">—</span></div>
    </div>
    <div id="hist-chart"></div>
    <div class="table-wrap">
      <table id="hist-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="protocol">协议<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="username">用户<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="uplink">上行<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="downlink">下行<span class="sort-arrow"></span></th>
            <th class="sortable" data-sort="total">总量<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<footer>数据每 15 秒自动刷新 · 面板仅监听本机，经 Nginx 反代访问</footer>
<script src="app.js"></script>
</body>
</html>
