<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流量面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>流量面板</h1>
  <div class="stats">
    <div class="stat"><span class="label">总上行</span><span class="value" id="total-up">—</span></div>
    <div class="stat"><span class="label">总下行</span><span class="value" id="total-down">—</span></div>
    <div class="stat"><span class="label">用户数</span><span class="value" id="total-users">—</span></div>
  </div>
</header>

<main>
  <section>
    <h2>用户流量 <span class="hint">上行/下行/总量为当前周期，累计为终身总量</span>
      <button id="reset-all" class="btn">全部重置</button>
    </h2>
    <div class="table-wrap">
      <table id="users-table">
        <thead>
          <tr>
            <th>协议</th>
            <th>用户</th>
            <th>上行</th>
            <th>下行</th>
            <th>总量</th>
            <th>累计</th>
            <th>周期起始</th>
            <th>状态</th>
            <th>最近活跃</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>流量趋势
      <select id="chart-user" style="margin-left:12px;"></select>
      <select id="chart-hours" style="margin-left:8px;">
        <option value="24">最近 24 小时</option>
        <option value="72">最近 3 天</option>
        <option value="168">最近 7 天</option>
      </select>
    </h2>
    <div id="chart"></div>
  </section>

  <section>
    <h2>最近连接
      <select id="conn-protocol" style="margin-left:12px;">
        <option value="all">全部协议</option>
      </select>
      <select id="conn-user" style="margin-left:8px;">
        <option value="all">全部用户</option>
      </select>
    </h2>
    <div class="table-wrap">
      <table id="conn-table">
        <thead>
          <tr>
            <th>时间</th>
            <th>协议</th>
            <th>用户</th>
            <th>状态</th>
            <th>来源</th>
            <th>目标</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>历史统计
      <select id="hist-protocol" style="margin-left:12px;">
        <option value="all">全部协议</option>
      </select>
      <select id="hist-user" style="margin-left:8px;">
        <option value="all">全部用户</option>
      </select>
      <select id="hist-range" style="margin-left:8px;">
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
        <option value="90">近 90 天</option>
        <option value="365">近 1 年</option>
        <option value="1095">近 3 年</option>
        <option value="custom">自定义</option>
      </select>
      <span id="hist-custom" style="display:none;margin-left:8px;">
        <input type="date" id="hist-from">
        <input type="date" id="hist-to">
      </span>
    </h2>
    <div class="hist-summary">
      <div class="stat"><span class="label">上行</span><span class="value" id="hist-up">—</span></div>
      <div class="stat"><span class="label">下行</span><span class="value" id="hist-down">—</span></div>
      <div class="stat"><span class="label">总量</span><span class="value" id="hist-total">—</span></div>
    </div>
    <div id="hist-chart"></div>
    <div class="table-wrap">
      <table id="hist-table">
        <thead>
          <tr>
            <th>协议</th>
            <th>用户</th>
            <th>上行</th>
            <th>下行</th>
            <th>总量</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<footer>数据每 15 秒自动刷新 · 面板仅监听本机，经 Nginx 反代访问</footer>
<script src="app.js"></script>
</body>
</html>
